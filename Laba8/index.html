
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Викторина</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Опрос-викторина</h1>
        <div id="quiz">
            <img id="questionImage" src="" alt="Вопрос" />
            <p id="questionText"></p>
            <form id="optionsForm"></form>
            <p id="timer">Осталось времени: <span id="time">10</span> сек.</p>
            <button id="submitBtn">Ответить</button>
        </div>
        <div id="result"></div>
        <button id="startBtn">Начать заново</button>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
