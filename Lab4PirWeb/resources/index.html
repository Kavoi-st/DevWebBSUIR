<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Опрос покупателя автомобилей</title>
    <link rel="stylesheet" href="C:/Users/Рома/Desktop/Lab4PirWeb/resources/spidfire.css">
</head>
<body>
    <div class="background-wrapper">
        <div class="container">
            <article class="survey-form">
                <h1>Опрос требований к автомобилю</h1>
                <form id="carForm">
                    <div class="form-group">
                        <label>ФИО:</label>
                        <input type="text" required pattern="[А-Яа-яЁё\s]+">
                    </div>

                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" required>
                    </div>

                    <div class="form-group">
                        <label>Желаемая мощность (л.с.): <span id="powerValue">150</span></label>
                        <input type="range" min="50" max="500" value="150" oninput="document.getElementById('powerValue').innerText = this.value">
                    </div>

                    <div class="form-group">
                        <label>Дополнительно:</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="options" value="climate"> Климат-контроль</label>
                            <label><input type="checkbox" name="options" value="leather"> Кожаный салон</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Тип КПП:</label>
                        <div class="radio-group">
                            <label><input type="radio" name="transmission" value="auto" required> Автомат</label>
                            <label><input type="radio" name="transmission" value="manual"> Механика</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Кузов:</label>
                        <select required>
                            <option value="">Выберите</option>
                            <option value="sedan">Седан</option>
                            <option value="suv">Внедорожник</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Бюджет ($):</label>
                        <input type="number" min="5000" step="1000" required>
                    </div>

                    <div class="button-group">
                        <button type="reset">Очистить</button>
                        <button type="button" onclick="saveAndShow()">Результаты</button>
                        <button type="submit">Сохранить</button>
                    </div>
                </form>
            </article>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2>История запросов</h2>
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>ФИО</th>
                        <th>Email</th>
                        <th>Мощность</th>
                        <th>Доп.опции</th>
                        <th>КПП</th>
                        <th>Кузов</th>
                        <th>Бюджет</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            
            <div class="modal-buttons">
                <button onclick="window.history.back()">Назад</button>
                <button onclick="document.getElementById('modal').style.display='none'">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="C:/Users/Рома/Desktop/Lab4PirWeb/resources/script.js"></script>
</body>
</html>
