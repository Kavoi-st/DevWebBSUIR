<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вариант 11/Сараф</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <h1 id="mainHeader">Машинки</h1>
    </header>
    <section>
        <input type="text" id="textInput" placeholder="Введите текст">
        <button id="addToListButton">Добавить в список</button>
        <select id="imageSelector">
            <option value="0">Выберите картинку</option>
            <option value="1">Картинка 1</option>
            <option value="2">Картинка 2</option>
            <option value="3">Картинка 3</option>
            <option value="4">Картинка 4</option>
            <option value="5">Картинка 5</option>
        </select>
        <div id="imageContainer"> </div>
        <button id="showAllImagesButton">Показать все картинки</button>
    </section>
    <footer>
        <p>Футер сайта</p>
    </footer>
    <script src="../js/scripts.js"></script>
</body>
</html>
