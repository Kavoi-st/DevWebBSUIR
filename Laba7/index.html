<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сценарии на основе ECMA6</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h1>Настройка блоков</h1>
  <div id="controls">
    <label>Размер:
      <select id="sizeSelector">
        <option value="100">100x100</option>
        <option value="150">150x150</option>
        <option value="200">200x200</option>
        <option value="250">250x250</option>
        <option value="300">300x300</option>
      </select>
    </label>
    <label>Позиция:
      <select id="positionSelector">
        <option value="top-left">Слева сверху</option>
        <option value="top-right">Справа сверху</option>
        <option value="bottom-left">Слева снизу</option>
        <option value="bottom-right">Справа снизу</option>
        <option value="center">Центр</option>
      </select>
    </label>
    <label>Картинка:
      <select id="imageSelector">
        <option value="1.jpg">Картинка 1</option>
        <option value="2.jpg">Картинка 2</option>
        <option value="3.jpg">Картинка 3</option>
      </select>
    </label>
    <label>Текст:
      <select id="textSelector">
        <option value="Текст 1">Текст 1</option>
        <option value="Текст 2">Текст 2</option>
        <option value="Текст 3">Текст 3</option>
        <option value="Текст 4">Текст 4</option>
        <option value="Текст 5">Текст 5</option>
      </select>
    </label>
    <button id="createBlock">Создать блок</button>
  </div>

  <div id="workspace"></div>

  <script src="js/main.js"></script>
</body>
</html>
